<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseAlert AI - Compact</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #6366f1; --danger: #ff4757; --success: #2ed573; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            width: 900px; /* Giới hạn chiều rộng cố định để không bị to quá */
            max-width: 95vw;
            background: white;
            border-radius: 16px;
            display: grid;
            grid-template-columns: 550px 1fr; /* Cố định chiều rộng cột cam */
            gap: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Vùng Camera chuẩn tỉ lệ */
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 4 / 3; /* Giữ đúng tỉ lệ camera thường */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
            object-fit: contain;
        }

        .info-section { display: flex; flex-direction: column; gap: 15px; }

        .card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #eee;
        }

        .status-badge {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .good { color: var(--success); background: #eafff0; }
        .bad { color: var(--danger); background: #fff0f0; border: 1px solid var(--danger); }

        .timer { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 5px 0; }

        .btn-start {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        #chart-container { height: 180px; width: 100%; position: relative; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="left-col">
        <div class="video-container">
            <canvas id="canvas"></canvas>
        </div>
        <button class="btn-start" onclick="init()">⚡ BẮT ĐẦU GIÁM SÁT</button>
    </div>

    <div class="info-section">
        <div class="card" id="status-card">
            <div id="status-text" class="status-badge good">Sẵn sàng</div>
            <div class="timer" id="timer-display">00s</div>
            <div id="pose-name" style="font-size: 0.9rem; color: #666;">Chưa có dữ liệu</div>
        </div>

        <div class="card">
            <h5 style="margin: 0 0 10px 0;">Tỉ lệ đúng/sai</h5>
            <div id="chart-container">
                <canvas id="myChart"></canvas>
            </div>
            <p style="font-size: 0.75rem; color: #999; margin-top: 10px;">
                Nhắc nhở sau 30 giây liên tục.
            </p>
        </div>
    </div>
</div>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/a8QICad-j/";
    let model, webcam, ctx, chart;
    let wrongStartTime = null;
    let stats = { good: 1, bad: 0 };

    async function init() {
        document.getElementById("status-text").innerText = "Đang tải...";
        model = await tmPose.load(URL + "model.json", URL + "metadata.json");
        
        // Setup webcam với kích thước chuẩn
        webcam = new tmPose.Webcam(550, 412, false); 
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        const canvas = document.getElementById("canvas");
        canvas.width = 550; canvas.height = 412;
        ctx = canvas.getContext("2d");

        initChart();
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        const prediction = await model.predict(posenetOutput);

        let topClass = "";
        let topProb = 0;
        for (let i = 0; i < model.getTotalClasses(); i++) {
            if (prediction[i].probability > topProb) {
                topProb = prediction[i].probability;
                topClass = prediction[i].className;
            }
        }

        handleLogic(topClass);
        drawPose(pose);
    }

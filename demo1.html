<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>PoseAlert - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; }
        .dashboard { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
        .panel { background: white; padding: 20px; border-radius: 10px; border: 1px solid #ccc; width: 400px;}
        #status { font-size: 24px; font-weight: bold; margin: 10px; padding: 10px; }
        .good { background-color: #d1fae5; color: #065f46; }
        .bad { background-color: #fee2e2; color: #991b1b; }
        .chart-container { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>PoseAlert Dashboard</h1>
    <button onclick="init()">Bật Hệ Thống</button>
    
    <div class="dashboard">
        <div class="panel">
            <h3>Camera</h3>
            <canvas id="canvas"></canvas>
            <div id="label-container"></div>
        </div>
        
        <div class="panel">
            <h3>Điều Khiển & Thống Kê</h3>
            <div id="status">Chờ khởi động...</div>
            <p>Thời gian đếm ngược cảnh báo:</p>
            <div id="timer-text" style="font-size: 20px; font-weight:bold;">0s / 30s</div>
            
            <div class="chart-container">
                <canvas id="statsChart"></canvas>
            </div>
        </div>
    </div>

    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/a8QICad-j/"; 
    let model, webcam, ctx, labelContainer, maxPredictions;
    
    let badPostureTimer = 0;
    let timerInterval = null;
    
    // Khai báo biến biểu đồ
    let statsData = { 'ngồi đúng': 0, 'cúi đầu': 0, 'vẹo lưng': 0, 'mắt gần': 0 };
    let chart;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const size = 400;
        webcam = new tmPose.Webcam(size, size, true);
        await webcam.setup(); 
        await webcam.play();
        window.requestAnimationFrame(loop);

        const canvas = document.getElementById("canvas");
        canvas.width = size; canvas.height = size;
        ctx = canvas.getContext("2d");
        labelContainer = document.getElementById("label-container");

        initChart();
        setInterval(updateChartData, 1000);
    }

    async function loop() {
        webcam.update(); 
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        const prediction = await model.predict(posenetOutput);

        let highestProb = 0;
        let currentPose = "";
        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > highestProb) {
                highestProb = prediction[i].probability;
                currentPose = prediction[i].className;
            }
        }
        
        labelContainer.innerHTML = currentPose;
        handlePostureLogic(currentPose);
        drawPose(pose);
    }

    function handlePostureLogic(currentPose) {
        const statusDiv = document.getElementById("status");
        
        if(statsData[currentPose] !== undefined) {
            window.currentDetectedPose = currentPose; 
        } else {
            window.currentDetectedPose = 'khác';
        }

        if (currentPose.toLowerCase() !== "ngồi đúng" && currentPose.toLowerCase() !== "normal") {
            statusDiv.innerText = "Sai tư thế: " + currentPose;
            statusDiv.className = "bad";
            
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    badPostureTimer++;
                    document.getElementById("timer-text").innerText = badPostureTimer + "s / 30s";
                    if (badPostureTimer >= 30) {
                        document.getElementById("alarm-sound").play();
                    }
                }, 1000);
            }
        } else {
            statusDiv.innerText = "Tư thế chuẩn";
            statusDiv.className = "good";
            
            badPostureTimer = 0;
            document.getElementById("timer-text").innerText = "0s / 30s";
            document.getElementById("alarm-sound").pause();
            document.getElementById("alarm-sound").currentTime = 0;
            
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
    }

    function drawPose(pose) {
        if (webcam.canvas) {
            ctx.drawImage(webcam.canvas, 0, 0);
            if (pose) {
                tmPose.drawKeypoints(pose.keypoints, 0.5, ctx);
                tmPose.drawSkeleton(pose.keypoints, 0.5, ctx);
            }
        }
    }

    function initChart() {
        const ctxChart = document.getElementById('statsChart').getContext('2d');
        chart = new Chart(ctxChart, {
            type: 'doughnut',
            data: {
                labels: ['Ngồi đúng', 'Cúi đầu', 'Vẹo lưng', 'Mắt gần'],
                datasets: [{
                    data: [0, 0, 0, 0],
                    backgroundColor: ['#2ed573', '#ff4757', '#ffa502', '#1e90ff']
                }]
            }
        });
    }

    function updateChartData() {
        if (!window.currentDetectedPose) return;
        if (statsData[window.currentDetectedPose] !== undefined) {
            statsData[window.currentDetectedPose]++;
        }
        const total = Object.values(statsData).reduce((a, b) => a + b, 0);
        if (total > 0) {
            chart.data.datasets[0].data = [
                statsData['ngồi đúng'], statsData['cúi đầu'], statsData['vẹo lưng'], statsData['mắt gần']
            ];
            chart.update();
        }
    }
</script>
</body>
</html>

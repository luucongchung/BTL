<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>PoseAlert - Timer & Warning</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; }
        .dashboard { display: flex; justify-content: center; gap: 50px; margin-top: 20px; }
        #status { font-size: 24px; font-weight: bold; margin: 10px; }
        .good { color: green; }
        .bad { color: red; }
        #timer-text { font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>PoseAlert - Hệ thống Cảnh Báo</h1>
    <button onclick="init()">Bật Hệ Thống</button>
    
    <div class="dashboard">
        <div>
            <canvas id="canvas"></canvas>
            <div id="label-container"></div>
        </div>
        <div>
            <div id="status">Chờ khởi động...</div>
            <p>Thời gian sai tư thế:</p>
            <div id="timer-text">0s / 30s</div>
        </div>
    </div>

    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/a8QICad-j/"; 
    let model, webcam, ctx, labelContainer, maxPredictions;
    
    // Thêm các biến quản lý thời gian
    let badPostureTimer = 0;
    let timerInterval = null;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const size = 400;
        webcam = new tmPose.Webcam(size, size, true);
        await webcam.setup(); 
        await webcam.play();
        window.requestAnimationFrame(loop);

        const canvas = document.getElementById("canvas");
        canvas.width = size; canvas.height = size;
        ctx = canvas.getContext("2d");
        labelContainer = document.getElementById("label-container");
    }

    async function loop() {
        webcam.update(); 
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        const prediction = await model.predict(posenetOutput);

        let highestProb = 0;
        let currentPose = "";
        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > highestProb) {
                highestProb = prediction[i].probability;
                currentPose = prediction[i].className;
            }
        }
        
        labelContainer.innerHTML = currentPose;
        handlePostureLogic(currentPose);
        drawPose(pose);
    }

    function handlePostureLogic(currentPose) {
        const statusDiv = document.getElementById("status");
        
        if (currentPose.toLowerCase() !== "ngồi đúng" && currentPose.toLowerCase() !== "normal") {
            statusDiv.innerText = "Sai tư thế: " + currentPose;
            statusDiv.className = "bad";
            
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    badPostureTimer++;
                    document.getElementById("timer-text").innerText = badPostureTimer + "s / 30s";
                    if (badPostureTimer >= 30) {
                        document.getElementById("alarm-sound").play();
                    }
                }, 1000);
            }
        } else {
            statusDiv.innerText = "Tư thế chuẩn";
            statusDiv.className = "good";
            
            badPostureTimer = 0;
            document.getElementById("timer-text").innerText = "0s / 30s";
            document.getElementById("alarm-sound").pause();
            document.getElementById("alarm-sound").currentTime = 0;
            
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
    }

    function drawPose(pose) {
        if (webcam.canvas) {
            ctx.drawImage(webcam.canvas, 0, 0);
            if (pose) {
                tmPose.drawKeypoints(pose.keypoints, 0.5, ctx);
                tmPose.drawSkeleton(pose.keypoints, 0.5, ctx);
            }
        }
    }
</script>
</body>
</html>

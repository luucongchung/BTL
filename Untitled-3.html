<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseAlert - AI Posture Monitor</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tỷ lệ camera giống Teachable Machine (hình vuông/hơi chữ nhật) */
        #canvas-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1; 
            border-radius: 10px;
            overflow: hidden;
            background-color: #000;
            position: relative;
        }

        #canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        .status-panel {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }

        .status-text {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            padding: 10px 20px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .status-good { background-color: #d1fae5; color: var(--success); }
        .status-bad { background-color: #fee2e2; color: var(--danger); animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #warning-alert {
            display: none;
            background-color: var(--danger);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .controls {
            margin-top: 15px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #4338ca;
        }

        .chart-container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        /* Thanh tiến trình cảnh báo 30s */
        .progress-bar-container {
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 8px;
            margin-top: 10px;
            height: 10px;
            overflow: hidden;
        }

        #warning-progress {
            height: 100%;
            width: 0%;
            background-color: var(--danger);
            transition: width 1s linear;
        }
    </style>
</head>
<body>

    <h1>🧘 PoseAlert - Hệ thống Cảnh báo Tư thế</h1>
    
    <div class="controls">
        <button type="button" onclick="init()">Bắt đầu Camera & AI</button>
    </div>

    <div class="dashboard" style="margin-top: 20px;">
        <div class="card">
            <h3>Camera Realtime</h3>
            <div id="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
            <div id="label-container" style="margin-top: 10px; font-weight: bold;">Đang chờ khởi động...</div>
        </div>

        <div class="card status-panel">
            <h3>Trạng thái hiện tại</h3>
            <div id="current-status" class="status-text status-good">Đang tải...</div>
            
            <p>Thời gian ngồi sai liên tục:</p>
            <div class="progress-bar-container">
                <div id="warning-progress"></div>
            </div>
            <span id="timer-text">0s / 30s</span>

            <div id="warning-alert">
                ⚠️ PHÁT HIỆN NGỒI SAI TƯ THẾ QUÁ 30 GIÂY! VUI LÒNG NGỒI THẲNG LÊN! ⚠️
            </div>

            <div class="chart-container">
                <canvas id="statsChart"></canvas>
            </div>
        </div>
    </div>

    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script type="text/javascript">
    // ==========================================
    // THAY LINK MODEL CỦA BẠN VÀO ĐÂY:
    const URL = "https://teachablemachine.withgoogle.com/models/a8QICad-j/"; 
    // ==========================================

    let model, webcam, ctx, labelContainer, maxPredictions;
    let badPostureTimer = 0;
    let timerInterval = null;
    let isWarningActive = false;

    // Dữ liệu thống kê
    let statsData = {
        'ngồi đúng': 0,
        'cúi đầu': 0,
        'vẹo lưng': 0,
        'mắt gần': 0
    };
    let chart;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        document.getElementById("label-container").innerText = "Đang tải model AI...";

        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Setup Webcam (Tỷ lệ vuông 400x400 giống ảnh)
        const size = 400;
        const flip = true; 
        webcam = new tmPose.Webcam(size, size, flip);
        await webcam.setup(); 
        await webcam.play();
        window.requestAnimationFrame(loop);

        // Setup Canvas
        const canvas = document.getElementById("canvas");
        canvas.width = size; canvas.height = size;
        ctx = canvas.getContext("2d");
        labelContainer = document.getElementById("label-container");

        initChart();
        setInterval(updateChartData, 1000); // Cập nhật biểu đồ mỗi giây
    }

    async function loop(timestamp) {
        webcam.update(); 
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        const prediction = await model.predict(posenetOutput);

        let highestProb = 0;
        let currentPose = "";

        // Tìm tư thế có xác suất cao nhất
        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > highestProb) {
                highestProb = prediction[i].probability;
                currentPose = prediction[i].className;
            }
        }

        // Hiển thị text %
        labelContainer.innerHTML = currentPose + " (" + (highestProb * 100).toFixed(0) + "%)";

        handlePostureLogic(currentPose);
        drawPose(pose);
    }

    function handlePostureLogic(currentPose) {
        const statusDiv = document.getElementById("current-status");
        
        // Cập nhật thống kê
        if(statsData[currentPose] !== undefined) {
            // Biến này được update bởi setInterval bên dưới
            window.currentDetectedPose = currentPose; 
        } else {
            // Fallback nếu tên class không khớp hoàn toàn
            window.currentDetectedPose = 'khác'; 
        }

        // Kiểm tra tư thế sai (giả sử tên class là 'ngồi đúng')
        // BẠN CẦN CHỈNH SỬA CHUỖI "ngồi đúng" ĐÚNG VỚI TÊN CLASS TRONG TEACHABLE MACHINE CỦA BẠN
        const isGoodPosture = (currentPose.toLowerCase() === "ngồi đúng" || currentPose.toLowerCase() === "normal");

        if (!isGoodPosture) {
            statusDiv.innerText = "Sai tư thế: " + currentPose;
            statusDiv.className = "status-text status-bad";
            
            // Logic đếm thời gian
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    badPostureTimer++;
                    document.getElementById("timer-text").innerText = badPostureTimer + "s / 30s";
                    document.getElementById("warning-progress").style.width = (badPostureTimer / 30 * 100) + "%";

                    if (badPostureTimer >= 30 && !isWarningActive) {
                        triggerWarning();
                    }
                }, 1000);
            }
        } else {
            statusDiv.innerText = "Tư thế chuẩn";
            statusDiv.className = "status-text status-good";
            resetWarning();
        }
    }

    function triggerWarning() {
        isWarningActive = true;
        document.getElementById("warning-alert").style.display = "block";
        document.getElementById("alarm-sound").play();
    }

    function resetWarning() {
        isWarningActive = false;
        badPostureTimer = 0;
        document.getElementById("timer-text").innerText = "0s / 30s";
        document.getElementById("warning-progress").style.width = "0%";
        document.getElementById("warning-alert").style.display = "none";
        document.getElementById("alarm-sound").pause();
        document.getElementById("alarm-sound").currentTime = 0;
        
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function drawPose(pose) {
        if (webcam.canvas) {
            ctx.drawImage(webcam.canvas, 0, 0);
            if (pose) {
                const minPartConfidence = 0.5;
                tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
            }
        }
    }

    function initChart() {
        const ctxChart = document.getElementById('statsChart').getContext('2d');
        chart = new Chart(ctxChart, {
            type: 'doughnut',
            data: {
                labels: ['Ngồi đúng', 'Cúi đầu', 'Vẹo lưng', 'Mắt gần'],
                datasets: [{
                    data: [0, 0, 0, 0],
                    backgroundColor: ['#10b981', '#ef4444', '#f59e0b', '#3b82f6'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'Tỷ lệ tư thế trong phiên học' }
                }
            }
        });
    }

    function updateChartData() {
        if (!window.currentDetectedPose) return;
        
        if (statsData[window.currentDetectedPose] !== undefined) {
            statsData[window.currentDetectedPose]++;
        }

        const total = Object.values(statsData).reduce((a, b) => a + b, 0);
        if (total > 0) {
            chart.data.datasets[0].data = [
                statsData['ngồi đúng'],
                statsData['cúi đầu'],
                statsData['vẹo lưng'],
                statsData['mắt gần']
            ];
            chart.update();
        }
    }
</script>

</body>
</html>

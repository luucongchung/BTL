<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseAlert AI - Chỉnh sửa gương</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #6366f1; --danger: #ff4757; --success: #2ed573; --bg: #f0f2f5; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #764ba2;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Cố định màn hình không cho cuộn */
        }

        .dashboard {
            width: 95vw;
            height: 90vh;
            background: white;
            border-radius: 20px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Vùng Camera */
        .cam-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .video-container {
            flex-grow: 1;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Chỉnh camera không bị ngược và chiếm hết khung */
        canvas {
            height: 100% !important;
            width: auto !important;
            /* transform: scaleX(-1); */ /* Đã bỏ dòng này để không bị ngược chữ */
        }

        /* Vùng Thống kê */
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .status-badge {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .good { color: var(--success); background: #eafff0; }
        .bad { color: var(--danger); background: #fff0f0; border: 2px solid var(--danger); animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .timer { font-size: 3rem; font-weight: 800; color: var(--primary); }

        .btn-start {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
        }

        #chart-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="cam-section">
        <div class="video-container">
            <canvas id="canvas"></canvas>
        </div>
        <button class="btn-start" onclick="init()">⚡ BẮT ĐẦU GIÁM SÁT</button>
    </div>

    <div class="info-section">
        <div class="card" id="status-card">
            <div id="status-text" class="status-badge good">Hệ thống sẵn sàng</div>
            <div class="timer" id="timer-display">00s</div>
            <div id="pose-name" style="font-weight: 600; color: #666;">Chưa có dữ liệu</div>
        </div>

        <div class="card" style="flex-grow: 1; display: flex; flex-direction: column;">
            <h4 style="margin: 0 0 10px 0;">Tỷ lệ tư thế (%)</h4>
            <div id="chart-container">
                <canvas id="myChart"></canvas>
            </div>
            <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">
                Cảnh báo giọng nói sau 30s ngồi sai liên tục.
            </p>
        </div>
    </div>
</div>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/a8QICad-j/";
    let model, webcam, ctx, labelContainer, maxPredictions;
    let wrongStartTime = null;
    let stats = { good: 1, bad: 0 };
    let chart;

    async function init() {
        document.getElementById("status-text").innerText = "Đang tải AI...";
        model = await tmPose.load(URL + "model.json", URL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        // Cấu hình webcam: flip = false để KHÔNG bị ngược
        webcam = new tmPose.Webcam(640, 480, false); 
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        const canvas = document.getElementById("canvas");
        canvas.width = 640; canvas.height = 480;
        ctx = canvas.getContext("2d");

        initChart();
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        const prediction = await model.predict(posenetOutput);

        let topClass = "";
        let topProb = 0;

        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > topProb) {
                topProb = prediction[i].probability;
                topClass = prediction[i].className;
            }
        }

        handleLogic(topClass);
        drawPose(pose);
    }

    function handleLogic(pose) {
        const statusCard = document.getElementById("status-card");
        const statusText = document.getElementById("status-text");
        const timerDisplay = document.getElementById("timer-display");
        const poseNameDisplay = document.getElementById("pose-name");

        // Những class được coi là sai (Khớp với TM của bạn)
        const isBad = (pose === "cúi đầu" || pose === "vẹo lưng" || pose === "mắt gần");

        if (isBad) {
            statusText.innerText = "TƯ THẾ XẤU ⚠️";
            statusText.className = "status-badge bad";
            poseNameDisplay.innerText = "Bạn đang: " + pose;
            
            if (!wrongStartTime) wrongStartTime = Date.now();
            let elapsed = Math.floor((Date.now() - wrongStartTime) / 1000);
            timerDisplay.innerText = (elapsed < 10 ? "0" : "") + elapsed + "s";

            if (elapsed >= 30) {
                speakNotification(pose);
                wrongStartTime = Date.now(); // Reset để nhắc lại sau 30s
            }
            stats.bad++;
        } else {
            statusText.innerText = "TƯ THẾ ĐÚNG ✅";
            statusText.className = "status-badge good";
            poseNameDisplay.innerText = "Đang ngồi rất tốt";
            wrongStartTime = null;
            timerDisplay.innerText = "00s";
            stats.good++;
        }
        updateChart();
    }

    function speakNotification(pose) {
        const utter = new SpeechSynthesisUtterance(`Bạn ơi, bạn đang ${pose}, hãy ngồi thẳng lưng lên nhé!`);
        utter.lang = 'vi-VN';
        window.speechSynthesis.speak(utter);
    }

    function initChart() {
        const ctxChart = document.getElementById('myChart').getContext('2d');
        chart = new Chart(ctxChart, {
            type: 'doughnut',
            data: {
                labels: ['Đúng', 'Sai'],
                datasets: [{
                    data: [1, 0],
                    backgroundColor: ['#2ed573', '#ff4757'],
                    borderWidth: 0
                }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
    }

    function updateChart() {
        if (chart) {
            chart.data.datasets[0].data = [stats.good, stats.bad];
            chart.update('none');
        }
    }

    function drawPose(pose) {
        if (webcam.canvas) {
            ctx.drawImage(webcam.canvas, 0, 0);
            if (pose) {
                tmPose.drawKeypoints(pose.keypoints, 0.5, ctx);
                tmPose.drawSkeleton(pose.keypoints, 0.5, ctx);
            }
        }
    }
</script>
</body>
</html>
